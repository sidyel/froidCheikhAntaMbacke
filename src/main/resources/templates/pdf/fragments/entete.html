<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="entete">

  <!-- Mode IMAGE avec image disponible -->
  <th:block th:if="${isImageMode and imageEnTeteUri != null}">
    <div style="text-align:center;margin-bottom:4mm;">
      <img th:src="${imageEnTeteUri}" style="display:block;width:100%;max-height:50mm;"/>
    </div>
  </th:block>

  <!-- Mode COMPOSÉ (ou fallback si image absente) -->
  <th:block th:unless="${isImageMode and imageEnTeteUri != null}">

    <!-- Ligne 1 : logo GAUCHE + nom entreprise à DROITE -->
    <!--
      Stratégie openhtmltopdf :
      - Pas de table-layout:fixed (auto répartit mieux l'espace résiduel)
      - Cellule logo : width:44mm, overflow:hidden — le wrapper div fixe la zone de 40×20mm
        et coupe tout débordement (image large → pas d'écrasement de la cellule nom)
      - Cellule nom : pas de width explicite, prend l'espace restant
      - Retrait de min-width/white-space:nowrap → le nom peut passer à la ligne si nécessaire
    -->
    <table width="100%" style="border-collapse:collapse;margin-bottom:2mm;" cellpadding="0" cellspacing="0">
      <tr>
        <td th:if="${logoUri != null}" style="width:44mm;vertical-align:middle;padding-right:3mm;overflow:hidden;">
          <div style="width:40mm;height:20mm;overflow:hidden;line-height:0;font-size:0;">
            <img th:src="${logoUri}" style="height:20mm;width:auto;display:block;max-width:none;"/>
          </div>
        </td>
        <td style="vertical-align:middle;">
          <div th:style="${nomFontStyle}" th:text="${raisonSociale}">NOM ENTREPRISE</div>
        </td>
      </tr>
    </table>

    <!-- Ligne 2 : texte descriptif des activités, centré, gras, noir, 10 pt -->
    <th:block th:if="${texteDescriptif != null}">
      <div style="font-family:'LiberationSans';font-weight:bold;font-size:10pt;color:#000;text-align:center;margin-bottom:3mm;"
           th:text="${texteDescriptif}">Description des activités</div>
    </th:block>

    <!-- Double trait épais + fin dans la couleur des documents -->
    <div th:style="'border-top:3pt solid '+${couleur}+';border-bottom:1pt solid '+${couleur}+';height:0;padding:2pt 0;margin:0 0 4mm 0;'"></div>

  </th:block>

</th:block>
</body>
</html>
