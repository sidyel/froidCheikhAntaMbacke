<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="entete">

  <!-- Mode IMAGE avec image disponible -->
  <th:block th:if="${isImageMode and imageEnTeteUri != null}">
    <div style="text-align:center;margin-bottom:4mm;">
      <img th:src="${imageEnTeteUri}" style="display:block;width:100%;max-height:50mm;"/>
    </div>
  </th:block>

  <!-- Mode COMPOSÉ (ou fallback si image absente) -->
  <th:block th:unless="${isImageMode and imageEnTeteUri != null}">

    <!-- Ligne 1 : logo GAUCHE + nom entreprise à DROITE sur une seule ligne -->
    <!-- table-layout:fixed bloque strictement la largeur de chaque colonne -->
    <table width="100%" style="table-layout:fixed;margin-bottom:2mm;" cellpadding="0" cellspacing="0">
      <th:block th:if="${logoUri != null}">
        <col style="width:32mm;"/>
        <col/>
      </th:block>
      <tr>
        <th:block th:if="${logoUri != null}">
          <td style="vertical-align:middle;padding-right:4mm;overflow:hidden;">
            <img th:src="${logoUri}" style="height:14mm;width:auto;max-width:27mm;display:inline-block;"/>
          </td>
        </th:block>
        <td style="vertical-align:middle;">
          <div th:style="${nomFontStyle}" th:text="${raisonSociale}">NOM ENTREPRISE</div>
        </td>
      </tr>
    </table>

    <!-- Ligne 2 : texte descriptif des activités, centré, gras, noir, 10 pt -->
    <th:block th:if="${texteDescriptif != null}">
      <div style="font-family:'LiberationSans';font-weight:bold;font-size:10pt;color:#000;text-align:center;margin-bottom:3mm;"
           th:text="${texteDescriptif}">Description des activités</div>
    </th:block>

    <!-- Double trait épais + fin dans la couleur des documents -->
    <div th:style="'border-top:3pt solid '+${couleur}+';border-bottom:1pt solid '+${couleur}+';height:0;padding:2pt 0;margin:0 0 4mm 0;'"></div>

  </th:block>

</th:block>
</body>
</html>
