<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="entete">

  <!-- Mode IMAGE avec image disponible -->
  <th:block th:if="${isImageMode and imageEnTeteUri != null}">
    <div style="text-align:center;">
      <img th:src="${imageEnTeteUri}" style="display:block;width:100%;max-height:48mm;"/>
    </div>
  </th:block>

  <!-- Mode COMPOSÉ (ou fallback si image absente) : logo + infos centrés -->
  <th:block th:unless="${isImageMode and imageEnTeteUri != null}">
    <table width="100%" style="margin-bottom:1mm;">
      <tr>
        <!-- Logo centré (si disponible) -->
        <th:block th:if="${logoUri != null}">
          <td style="text-align:center;padding-bottom:2mm;">
            <img th:src="${logoUri}" style="max-height:25mm;max-width:55mm;display:inline-block;"/>
          </td>
        </th:block>
      </tr>
      <tr>
        <!-- Raison sociale centrée -->
        <td style="text-align:center;vertical-align:middle;">
          <div th:style="${nomFontStyle}" th:text="${raisonSociale}">Nom entreprise</div>
          <div th:if="${texteDescriptif != null}" style="font-size:7pt;color:#555;margin-top:2pt;" th:text="${texteDescriptif}">Description</div>
          <!-- Informations légales centrées sous le nom -->
          <th:block th:if="${piedAdresse != null or piedTelephone != null or piedNinea != null or piedRccm != null}">
            <div style="font-size:7pt;color:#555;margin-top:2pt;">
              <th:block th:if="${piedAdresse != null}"><span th:text="${piedAdresse}">Adresse</span></th:block>
              <th:block th:if="${piedTelephone != null}">
                <span th:if="${piedAdresse != null}"> | </span>
                <span>Tél&#160;: </span><span th:text="${piedTelephone}">Tél</span>
              </th:block>
              <th:block th:if="${piedNinea != null}">
                <span> | NINEA&#160;: </span><span th:text="${piedNinea}">NINEA</span>
              </th:block>
              <th:block th:if="${piedRccm != null}">
                <span> | RC&#160;: </span><span th:text="${piedRccm}">RC</span>
              </th:block>
            </div>
          </th:block>
        </td>
      </tr>
    </table>
  </th:block>

</th:block>
</body>
</html>
