<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="docFooter" th:fragment="pied">

  <!-- Mode IMAGE pied -->
  <th:block th:if="${isImagePied and imagePiedUri != null}">
    <img th:src="${imagePiedUri}" style="width:100%;display:block;"/>
  </th:block>

  <!-- Mode COMPOSÉ : 3 lignes centrées, gras, noir, 8,5 pt -->
  <th:block th:unless="${isImagePied and imagePiedUri != null}">
    <div style="border-top:0.5pt solid #000;padding-top:3pt;font-family:'LiberationSans';font-weight:bold;font-size:8.5pt;color:#000;text-align:center;line-height:1.45;">

      <!-- Ligne 1 : Adresse — Tél — BP -->
      <th:block th:if="${piedAdresse != null or piedTelephone != null or piedBoitePostale != null}">
        <div>
          <th:block th:if="${piedAdresse != null}"><span th:text="${piedAdresse}">Adresse</span></th:block>
          <th:block th:if="${piedTelephone != null}">
            <span th:if="${piedAdresse != null}">&#160;&#8212;&#160;</span>
            <span>Tél&#160;: </span><span th:text="${piedTelephone}">Tél</span>
          </th:block>
          <th:block th:if="${piedBoitePostale != null}">
            <span th:if="${piedAdresse != null or piedTelephone != null}">&#160;&#8212;&#160;</span>
            <span th:text="${piedBoitePostale}">BP</span>
          </th:block>
        </div>
      </th:block>

      <!-- Ligne 2 : R.C — NINEA — Compte Bancaire -->
      <th:block th:if="${piedRccm != null or piedNinea != null or piedBanque != null}">
        <div>
          <th:block th:if="${piedRccm != null}">
            <span>R.C&#160;: </span><span th:text="${piedRccm}">RC</span>
          </th:block>
          <th:block th:if="${piedNinea != null}">
            <span th:if="${piedRccm != null}">&#160;&#8211;&#160;</span>
            <span>NINEA&#160;: </span><span th:text="${piedNinea}">NINEA</span>
          </th:block>
          <th:block th:if="${piedBanque != null}">
            <span th:if="${piedRccm != null or piedNinea != null}">&#160;&#8211;&#160;</span>
            <span>Compte Bancaire&#160;: </span><span th:text="${piedBanque}">Banque</span>
            <th:block th:if="${piedCompte != null}">
              <span>&#160;N°&#160;</span><span th:text="${piedCompte}">Compte</span>
            </th:block>
          </th:block>
        </div>
      </th:block>

      <!-- Ligne 3 : Email -->
      <th:block th:if="${piedEmail != null}">
        <div><span>Email&#160;: </span><span th:text="${piedEmail}">email</span></div>
      </th:block>

    </div>
  </th:block>

</div>
</body>
</html>
