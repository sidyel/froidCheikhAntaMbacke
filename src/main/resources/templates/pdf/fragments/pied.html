<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="docFooter" th:fragment="pied">

  <!-- Mode IMAGE pied -->
  <th:block th:if="${isImagePied and imagePiedUri != null}">
    <img th:src="${imagePiedUri}" style="width:100%;display:block;"/>
  </th:block>

  <!-- Mode COMPOSÉ texte -->
  <th:block th:unless="${isImagePied and imagePiedUri != null}">
    <div style="border-top:0.5pt solid #bbb;padding-top:2pt;font-size:7pt;color:#555;">

      <!-- Ligne 1 : adresse — BP -->
      <th:block th:if="${piedAdresse != null}">
        <span th:text="${piedAdresse}">Adresse</span>
        <th:block th:if="${piedBoitePostale != null}">
          <span> — </span><span th:text="${piedBoitePostale}">BP</span>
        </th:block>
        <br/>
      </th:block>

      <!-- Ligne 2 : Tél | RC | NINEA -->
      <th:block th:if="${piedTelephone != null or piedRccm != null or piedNinea != null}">
        <th:block th:if="${piedTelephone != null}">
          <span>Tél&#160;: </span><span th:text="${piedTelephone}">Tél</span>
        </th:block>
        <th:block th:if="${piedRccm != null}">
          <th:block th:if="${piedTelephone != null}"><span> | </span></th:block>
          <span>RC&#160;: </span><span th:text="${piedRccm}">RC</span>
        </th:block>
        <th:block th:if="${piedNinea != null}">
          <th:block th:if="${piedTelephone != null or piedRccm != null}"><span> | </span></th:block>
          <span>NINEA&#160;: </span><span th:text="${piedNinea}">NINEA</span>
        </th:block>
        <br/>
      </th:block>

      <!-- Ligne 3 : Banque | email -->
      <th:block th:if="${piedBanque != null or piedEmail != null}">
        <th:block th:if="${piedBanque != null}">
          <span>Banque&#160;: </span><span th:text="${piedBanque}">Banque</span>
          <th:block th:if="${piedCompte != null}">
            <span> N°&#160;</span><span th:text="${piedCompte}">Compte</span>
          </th:block>
        </th:block>
        <th:block th:if="${piedEmail != null}">
          <th:block th:if="${piedBanque != null}"><span> | </span></th:block>
          <span th:text="${piedEmail}">email</span>
        </th:block>
      </th:block>

    </div>
  </th:block>

</div>
</body>
</html>
