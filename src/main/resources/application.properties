spring.application.name=froid-cheikh-ecommerce
server.port=${PORT:8080}
spring.config.import=optional:file:./.env[.properties]

# Datasource - Neon PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — optimisé pour Neon (serverless, réveil ~5s, pooler PgBouncer)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=app/uploads
file.upload-dir=/tmp/uploads

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# CORS (liste séparée par virgules)
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Cache
spring.cache.type=simple
# Meta Conversions API (jeton d'accès — jamais en base ni dans le code)
meta.conversions.token=${META_CONVERSIONS_TOKEN:}
